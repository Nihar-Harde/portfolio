<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
    @font-face {
      font-family: 'HankoFont';
      src: url('data:font/truetype;charset=utf-8;base64,') format('truetype');
      font-weight: 800;
      font-style: normal;
    }
</style>
    <radialGradient id="vermilionA" cx="42%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#d63030"/>
      <stop offset="55%" stop-color="#b81e1e"/>
      <stop offset="100%" stop-color="#8d1212"/>
    </radialGradient>
    <filter id="wabiSabiA" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#wabiSabiA)">
    <!-- Solid Vermilion Seal Block with Hand-Chipped Wabi-Sabi Corners -->
    <rect x="15" y="15" width="170" height="170" rx="16" fill="url(#vermilionA)" />

    <!-- Authentic Stone Carving Micro-Chips & Imperfections -->
    <path d="M 15 42 Q 20 38 15 34 Z" fill="#faf7f2" />
    <path d="M 185 68 Q 180 72 185 76 Z" fill="#faf7f2" />
    <path d="M 94 185 Q 98 180 102 185 Z" fill="#faf7f2" />
    <path d="M 15 142 Q 19 146 15 150 Z" fill="#faf7f2" />
    <path d="M 148 15 Q 152 20 156 15 Z" fill="#faf7f2" />

    <!-- Pure Calligraphy: 晴 (Hakubun Intaglio / White Relief) -->
    <text x="100" y="145" 
          font-family="'HankoFont', 'Shippori Mincho', serif" 
          font-size="124" 
          font-weight="800" 
          fill="#faf7f2" 
          text-anchor="middle">晴</text>
  </g>

  <!-- Authentic Cinnabar Shuniku Micro-Spatter Particles -->
  <circle cx="28" cy="168" r="1.5" fill="#faf7f2" opacity="0.6"/>
  <circle cx="172" cy="35" r="1.3" fill="#faf7f2" opacity="0.5"/>
  <circle cx="166" cy="162" r="1.8" fill="#faf7f2" opacity="0.7"/>
</svg>